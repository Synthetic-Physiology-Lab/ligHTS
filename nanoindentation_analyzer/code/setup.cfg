# pycodestyle configuration. The documented check is
#
#     python -m pycodestyle --max-line-length 79 --ignore E203,W503 .
#
# E203 and W503 are the two documented conflicts between black and
# pycodestyle's reading of PEP 8; PEP 8 itself sides with black on both.
[pycodestyle]
exclude = __pycache__,.git
